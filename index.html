<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#263850">
  <title>Lynch Lions PTO</title>
  <style>
    :root { --navy:#263850; --gold:#f3b52f; --text:#eef2f7; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; font-family:Arial,Helvetica,sans-serif; background:var(--navy); color:white; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 20px; }
    .page { width:100%; max-width:760px; text-align:center; }
    .lion { font-size:58px; margin-bottom:16px; line-height:1; }
    h1 { margin:0 0 26px; font-family:Georgia,"Times New Roman",serif; font-size:clamp(64px,12vw,118px); line-height:.9; font-weight:700; letter-spacing:-3px; }
    .message { font-size:clamp(20px,4vw,29px); line-height:1.5; color:var(--text); margin:0 auto 36px; max-width:700px; }
    .button { display:inline-block; padding:18px 42px; background:var(--gold); color:#173353; border-radius:8px; text-decoration:none; font-size:22px; font-weight:700; transition:transform .15s ease,filter .15s ease; box-shadow:0 5px 15px rgba(0,0,0,.18); }
    .button:hover,.button:focus { transform:translateY(-2px); filter:brightness(1.06); }
    .footer { margin-top:34px; font-size:14px; color:rgba(255,255,255,.68); }
    @media (max-width:500px) {
      body { padding:24px 18px; }
      .lion { font-size:48px; }
      .message { font-size:20px; }
      .button { width:100%; max-width:300px; padding:17px 24px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="lion" aria-hidden="true">🦁</div>
    <h1>GOTCHA!</h1>
    <div class="message">
      Since you're here, let's make it official.<br>
      Learn more about the Lynch Lions PTO and how we support our students, staff, and school community.
    </div>
    <a class="button"
       href="https://docs.google.com/forms/d/e/1FAIpQLScPfGkPkZZxA5gNkK0UTTOKexyrxLGkb1Le_bJ6OQWVX0mlSA/viewform?usp=publish-editor"
       target="_blank" rel="noopener noreferrer">
      Learn more about the PTO
    </a>
    <div class="footer">Redmond Lynch Lions PTO</div>
  </main>
</body>
</html>
